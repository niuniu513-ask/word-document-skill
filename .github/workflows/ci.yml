name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-notebook.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: ruff check scripts/ tests/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=scripts --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate JSON schemas
        run: |
          python -c "
          import json, jsonschema
          for s in ['schemas/document-spec.json', 'schemas/content-model.json', 'schemas/task-model.json']:
              schema = json.load(open(s, encoding='utf-8'))
              jsonschema.Draft7Validator.check_schema(schema)
              print(f'OK: {s}')
          "

  engine:
    name: MoonBit engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh the package registry
        run: moon update

      - name: Check the engine
        working-directory: engine
        run: moon check --target js

      - name: Test the engine
        working-directory: engine
        run: moon test --target js

      - name: CLI smoke test
        working-directory: engine
        run: |
          moon run cmd/docx --target js -- info tests/fixtures/mini.docx
          moon run cmd/docx --target js -- issues tests/fixtures/mini.docx
